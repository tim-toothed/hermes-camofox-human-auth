name: validate-distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate distribution files
        run: |
          test -f docker-compose.yml
          test -f skills/human-auth/SKILL.md
          test -f plugin.yaml
          test -f __init__.py
          python - <<'PY'
          import pathlib, yaml
          skill = pathlib.Path('skills/human-auth/SKILL.md').read_text()
          assert skill.startswith('---') and 'name: human-auth' in skill
          yaml.safe_load(pathlib.Path('plugin.yaml').read_text())
          PY
          python -m py_compile __init__.py

      - name: Check pinned Camofox patches
        run: |
          git clone --depth 1 --branch master https://github.com/jo-inc/camofox-browser.git vendor/camofox-browser
          git -C vendor/camofox-browser fetch --depth 1 origin ce3a3b085aacba73eb8de6c51733c19fb13bfae4
          git -C vendor/camofox-browser checkout --detach ce3a3b085aacba73eb8de6c51733c19fb13bfae4
          test "$(git -C vendor/camofox-browser rev-parse HEAD)" = "ce3a3b085aacba73eb8de6c51733c19fb13bfae4"
          for patch in patches/*.patch; do
            (cd vendor/camofox-browser && \
              git apply --check --ignore-space-change --ignore-whitespace "$GITHUB_WORKSPACE/$patch" && \
              git apply --ignore-space-change --ignore-whitespace "$GITHUB_WORKSPACE/$patch")
          done
          bash tests/test-vnc-watcher-restarts-x11vnc.sh vendor/camofox-browser/plugins/vnc/vnc-watcher.sh
          node --check vendor/camofox-browser/server.js

      - name: Validate Compose syntax
        run: VNC_PASSWORD=ci-placeholder docker compose config -q
